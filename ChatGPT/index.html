      numberOfAyahs:surah.numberOfAyahs || (surah.ayahs || []).length,

  }
  function renderBookmarks() {
    const savedItems = state.bookmarks.map(item => ({item,surah:findSurah(item.surahNumber),ayah:findAyah(item.surahNumber,item.ayahNumber)})).filter(x=>x.surah&&x.ayah).sort((a,b)=>b.item.timestamp-a.item.timestamp);
    const historyItems = state.history.map(item=>({item,surah:findSurah(item.surahNumber),ayah:findAyah(item.surahNumber,item.ayahNumber)})).filter(x=>x.surah&&x.ayah).slice(0,18);
    const savedHtml = savedItems.length ? savedItems.map(({item,surah,ayah})=>`<button class="saved-item" type="button" data-action="go-ayah" data-surah="${surah.number}" data-ayah="${ayah.numberInSurah}"><span class="surah-num">${surah.number}:${ayah.numberInSurah}</span><span class="surah-name"><strong>${esc(surah.englishName)} · Ayah ${ayah.numberInSurah}</strong><span>${esc(ayah.translation||'Translation unavailable')}</span><span>${formatDate(item.timestamp)}</span></span><span class="surah-arabic" lang="ar">★</span></button>`).join('') : `<div class="empty-state"><div class="empty-icon">☆</div><h2>No bookmarks yet</h2><p>Tap the star beside an ayah while reading to save it here.</p><p style="margin-top:12px"><button type="button" class="outline-button" data-action="back-to-read">Start reading</button></p></div>`;
    const histHtml = historyItems.length ? historyItems.map(({item,surah,ayah})=>`<button class="history-item" type="button" data-action="go-ayah" data-surah="${surah.number}" data-ayah="${ayah.numberInSurah}"><span class="surah-num">${surah.number}:${ayah.numberInSurah}</span><span class="surah-name"><strong>${esc(surah.englishName)} · Ayah ${ayah.numberInSurah}</strong><span>${formatDate(item.timestamp)}</span></span><span class="muted">→</span></button>`).join('') : '<div class="empty-state"><h2>No reading history yet</h2><p>As you read, your recent places will appear here.</p></div>';
    viewRoot.innerHTML = `<div class="view-heading"><div><div class="eyebrow">Your personal library</div><h1>Saved & history</h1><div class="muted small">Bookmarks and reading places stay on this device.</div></div><span class="status-pill">${state.bookmarks.length} bookmarks</span></div><div class="section-label">Bookmarked ayahs <span class="muted small">${savedItems.length}</span></div><div class="saved-list">${savedHtml}</div><div class="section-label">Reading history <button type="button" class="text-button" data-action="clear-history">Clear history</button></div><div class="history-list">${histHtml}</div>`;
  }
  function renderSettings() {
    viewRoot.innerHTML = `<div class="view-heading"><div><div class="eyebrow">Make it yours</div><h1>Settings</h1><div class="muted small">Your preferences are saved on this device.</div></div></div>
      <section class="setting-card"><div class="setting-head"><div><strong>Appearance</strong><span>Choose comfortable reading colors.</span></div><button type="button" class="soft-button" data-action="toggle-theme">${state.prefs.theme==='dark'?'☀ Light mode':'☾ Dark mode'}</button></div></section>
      <section class="setting-card"><div class="setting-head"><div><strong>Arabic text size</strong><span>Adjust the Uthmani Quran text.</span></div><strong id="arabicSizeLabel">${state.prefs.arabicSize}px</strong></div><input type="range" min="24" max="48" step="1" value="${state.prefs.arabicSize}" data-setting="arabicSize" aria-label="Arabic text size"><div class="setting-footer"><span>Smaller</span><span>Larger</span></div></section>
      <section class="setting-card"><div class="setting-head"><div><strong>Translation text size</strong><span>Adjust English translation readability.</span></div><strong id="translationSizeLabel">${state.prefs.translationSize}px</strong></div><input type="range" min="13" max="24" step="1" value="${state.prefs.translationSize}" data-setting="translationSize" aria-label="Translation text size"><div class="setting-footer"><span>Smaller</span><span>Larger</span></div></section>
      <section class="setting-card"><div class="setting-head"><div><strong>English translation</strong><span>Show or hide the translation beneath ayahs.</span></div><input type="checkbox" data-setting="showTranslation" ${state.prefs.showTranslation?'checked':''} aria-label="Show English translation"></div></section>
      <section class="setting-card"><div class="setting-head"><div><strong>Recitation speed</strong><span>Default speed for Mishary Alafasy audio.</span></div><select id="settingsAudioSpeed" class="audio-speed" data-setting="playbackSpeed" aria-label="Default playback speed"><option value="0.75" ${state.prefs.playbackSpeed==.75?'selected':''}>0.75×</option><option value="1" ${state.prefs.playbackSpeed==1?'selected':''}>1×</option><option value="1.25" ${state.prefs.playbackSpeed==1.25?'selected':''}>1.25×</option><option value="1.5" ${state.prefs.playbackSpeed==1.5?'selected':''}>1.5×</option><option value="2" ${state.prefs.playbackSpeed==2?'selected':''}>2×</option></select></div></section>
      <section class="setting-card"><div class="setting-head"><div><strong>Offline reading</strong><span>${state.isSample?'Demo data only — download Quran data while online.':'Quran data '+(navigator.onLine?'is available for offline use after it has been saved.':'is loaded from local storage.')}</span></div><span aria-hidden="true">⌁</span></div><div class="setting-buttons"><button type="button" class="outline-button" data-action="retry-data">↻ Refresh Quran data</button><button type="button" class="outline-button" data-action="install-app" id="installButton">＋ Install app</button></div></section>
      <section class="setting-card"><div class="setting-head"><div><strong>Privacy</strong><span>No account, ads, analytics, or tracking. Bookmarks and preferences remain in your browser. Quran data comes from AlQuran Cloud when online.</span></div><span aria-hidden="true">⌑</span></div><div class="setting-buttons"><button type="button" class="text-button" data-action="reset-prefs">Reset preferences</button><button type="button" class="text-button" data-action="clear-all-local">Clear bookmarks & history</button></div></section>
      <section class="setting-card"><strong style="font-size:.9rem">About Quran Advance</strong><p class="muted small" style="margin-bottom:0">Arabic text: ${ARABIC_EDITION}. English translation: Saheeh International (${TRANSLATION_EDITION}). Recitation: Mishary Rashid Alafasy. See <a href="./readme.md" target="_blank" rel="noopener noreferrer">README and credits</a>.</p></section>`;
  }
  function renderSearchResults(query) {
    const normalized = query.trim().toLocaleLowerCase();
    if (!normalized) { renderReader(); return; }
    const surahMatches = state.quran.filter(s => `${s.number} ${s.englishName} ${s.englishNameTranslation} ${s.name}`.toLocaleLowerCase().includes(normalized)).slice(0,8);
    const ayahMatches = state.allAyahs.filter(a => `${a.text} ${a.translation} ${a.surahName} ${a.surahArabicName} ${a.surahNumber}:${a.numberInSurah}`.toLocaleLowerCase().includes(normalized)).slice(0,100);
    const surahSection = surahMatches.length ? `<div class="section-label">Matching surahs <span class="muted small">${surahMatches.length}</span></div><div class="surah-list">${surahMatches.map(surahItemHtml).join('')}</div>` : '';
    const ayahSection = ayahMatches.length ? `<div class="section-label">Matching ayahs <span class="muted small">${ayahMatches.length}${ayahMatches.length===100?'+':''}</span></div><div class="result-list">${ayahMatches.map(ayah=>`<button type="button" class="result-item" data-action="go-ayah" data-surah="${ayah.surahNumber}" data-ayah="${ayah.numberInSurah}"><div class="result-head"><strong>${esc(ayah.surahName)} · ${ayah.surahNumber}:${ayah.numberInSurah}</strong><span>Open →</span></div><div class="result-arabic" lang="ar" dir="rtl">${esc(ayah.text)}</div><div class="result-translation" data-translation>${esc(ayah.translation||'Translation unavailable')}</div></button>`).join('')}</div>` : '';
    viewRoot.innerHTML = `<div class="view-heading"><div><div class="eyebrow">Search the Quran</div><h1>Search results</h1><div class="muted small">${esc(query)} · ${ayahMatches.length} ayah matches shown</div></div><button type="button" class="text-button" data-action="clear-search">Clear ×</button></div>${surahSection}${ayahSection}${!surahMatches.length&&!ayahMatches.length?'<div class="empty-state"><div class="empty-icon">⌕</div><h2>No results found</h2><p>Try a different English word, Arabic phrase, surah name, or number.</p></div>':''}`;
    updateTranslationVisibility();
  }
  function fillJumpSurahs() {
    const select = $('#jumpSurah'); if (!select || !state.quran.length) return;
    const currentValue = select.value || String(state.currentSurahNumber);
    select.innerHTML = state.quran.map(s => `<option value="${s.number}">${s.number}. ${esc(s.englishName)} — ${esc(s.name)}</option>`).join('');
    select.value = state.surahByNumber.has(Number(currentValue)) ? currentValue : String(state.currentSurahNumber);
    updateJumpAyahLimit();
  }
  function updateJumpAyahLimit() {
    const surah = findSurah(Number($('#jumpSurah').value || state.currentSurahNumber));
    const input = $('#jumpAyah'); if (!input || !surah) return;
    input.max = String(surah.numberOfAyahs); input.value = String(Math.min(Number(input.value)||1,surah.numberOfAyahs));
  }
  function openJumpModal() {
    fillJumpSurahs(); $('#jumpModal').hidden = false; $('#jumpAyah').value = String(state.currentAyahNumber || 1); updateJumpAyahLimit(); $('#jumpSurah').focus();
  }
  function closeJumpModal() { $('#jumpModal').hidden = true; }
  function openSurah(surahNumber, ayahNumber=1, opts={}) {
    const surah = findSurah(Number(surahNumber)); if (!surah) { toast('That surah is not available in the current data.'); return; }
    state.currentSurahNumber = surah.number;
    state.currentAyahNumber = Math.max(1,Math.min(Number(ayahNumber)||1,surah.ayahs.length));
    const ayah = findAyah(surah.number,state.currentAyahNumber);
    state.currentGlobalNumber = ayah?.number || surah.ayahs[0]?.number || 1;
    recordLocation(surah.number,state.currentAyahNumber);
    closeJumpModal();
    state.currentView = 'reader';
    $$('.nav-item').forEach(btn => btn.classList.toggle('active',btn.dataset.view==='reader'));
    renderReader();
    requestAnimationFrame(() => { const card = $(`#ayah-${state.currentGlobalNumber}`); if (card) { card.scrollIntoView({behavior:'smooth',block:'start'}); card.classList.add('in-view'); } });
    if (opts.play) playGlobalAyah(state.currentGlobalNumber);
  }
  function getCurrentSurahAyah() { return findAyah(state.currentSurahNumber,state.currentAyahNumber) || state.ayahByGlobal.get(state.currentGlobalNumber); }
  function getAyahText(surahNumber, ayahNumber) {
    const surah = findSurah(surahNumber), ayah = findAyah(surahNumber,ayahNumber);
    if (!surah || !ayah) return '';
    return `${surah.englishName} ${surah.number}:${ayah.numberInSurah}\n${ayah.text}\n${ayah.translation || ''}`.trim();
  }
  async function copyAyah(surahNumber, ayahNumber) {
    const text = getAyahText(surahNumber,ayahNumber); if (!text) return;
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
      else { const area=document.createElement('textarea'); area.value=text; area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select(); const ok=document.execCommand('copy'); area.remove(); if(!ok) throw new Error('Copy unavailable'); }
      toast('Ayah copied');
    } catch { toast('Copy is not available in this browser'); }
  }
  async function shareAyah(surahNumber, ayahNumber) {
    const text = getAyahText(surahNumber,ayahNumber); if (!text) return;
    if (navigator.share) {
      try { await navigator.share({title:'Quran Advance — Ayah',text}); } catch (error) { if (error.name !== 'AbortError') toast('Sharing could not be opened'); }
    } else { await copyAyah(surahNumber,ayahNumber); toast('Sharing is unsupported; copied instead'); }
  }
  function playGlobalAyah(globalNumber) {
    const ayah = state.ayahByGlobal.get(Number(globalNumber)); if (!ayah) { toast('Recitation is unavailable in demo mode'); return; }
    if (state.isSample) { toast('Connect to the internet to load the complete Quran and audio.'); return; }
    const targetAudioUrl = `${AUDIO_BASE}${ayah.number}.mp3`;
    const changed = audio.src !== targetAudioUrl;
    const surah = findSurah(ayah.surahNumber);
    if (state.currentSurahNumber !== ayah.surahNumber) {
      state.currentSurahNumber = ayah.surahNumber; state.currentAyahNumber = ayah.numberInSurah;
      state.currentGlobalNumber = ayah.number; recordLocation(ayah.surahNumber,ayah.numberInSurah); renderView('reader');
    } else {
      state.currentAyahNumber = ayah.numberInSurah; state.currentGlobalNumber = ayah.number;
      const card = $(`#ayah-${ayah.number}`); if (card) card.scrollIntoView({behavior:'smooth',block:'center'});
    }
    state.playingGlobalNumber = ayah.number;
    if (changed) audio.src = targetAudioUrl;
    audio.playbackRate = Number(state.prefs.playbackSpeed || 1);
    audioPlayer.hidden = false;
    $('#audioTitle').textContent = `${surah.englishName} · Ayah ${ayah.numberInSurah}`;
    $('#audioSubtitle').textContent = 'Mishary Rashid Alafasy';
    updatePlayingUI();
    audio.play().then(() => {state.isPlaying=true;updatePlayingUI();}).catch(() => {state.isPlaying=false;updatePlayingUI();toast('Audio could not start. Check your connection and try again.');});
  }
  function updatePlayingUI() {
    $$('.ayah-card.playing').forEach(node=>node.classList.remove('playing'));
    if (state.isPlaying) { const current = $(`.ayah-card[data-global-ayah="${state.playingGlobalNumber || state.currentGlobalNumber}"]`); if (current) current.classList.add('playing'); }
    const playBtn = $('#audioPlayButton');
    if (playBtn) { playBtn.textContent = state.isPlaying ? 'Ⅱ' : '▶'; playBtn.setAttribute('aria-label',state.isPlaying?'Pause recitation':'Resume recitation'); }
    const repeat = $('#repeatButton'); if (repeat) { repeat.style.color = state.repeatAyah ? 'var(--green)' : 'var(--muted)'; repeat.style.borderColor = state.repeatAyah ? 'var(--green)' : 'var(--line)'; repeat.setAttribute('aria-pressed',String(state.repeatAyah)); }
  }
  function navigateGlobal(delta, shouldPlay=true) {
    const total = state.allAyahs.length;
    const playbackBase = state.playingGlobalNumber && audio.src ? state.playingGlobalNumber : state.currentGlobalNumber;
    const nextNumber = Number(playbackBase) + delta;
    if (nextNumber < 1 || nextNumber > total) { toast('You have reached the beginning or end of the Quran.'); return; }
    const next = state.ayahByGlobal.get(nextNumber); if (!next) return;
    openSurah(next.surahNumber,next.numberInSurah);
    if (shouldPlay) playGlobalAyah(nextNumber);
  }
  function startAudioAtCurrent() { const ayah = getCurrentSurahAyah(); if (ayah) playGlobalAyah(ayah.number); }
  function retryData() {
    if (!navigator.onLine) { toast('You are offline. Connect to the internet and retry.'); return; }
    setDataStatus('Refreshing Quran data');
    fetchFullQuran().then(async dataset => {
      await saveDataset(dataset); activateDataset(dataset,false); setDataStatus('Quran saved for offline use'); renderView(state.currentView); toast('Quran data refreshed');
    }).catch(error => { console.warn(error); setDataStatus(state.isSample?'Demo data only':'Using saved Quran data'); toast('Could not refresh Quran data.'); });
  }
  function installApp() {
    if (state.installPrompt) {
      state.installPrompt.prompt(); state.installPrompt.userChoice.then(choice=>{ if (choice.outcome==='accepted') toast('App installation started'); state.installPrompt=null; }).catch(()=>toast('Use your browser menu to install this app.'));
    } else toast('Use your browser menu and choose “Install app” or “Add to Home screen”.');
  }
  function clearHistory() { state.history=[]; setLocal('quranAdvanceHistory','[]'); renderView(state.currentView); toast('Reading history cleared'); }

  document.addEventListener('click', async event => {
    const button = event.target.closest('[data-action]');
    if (button) {
      const action = button.dataset.action;
      if (action === 'toggle-theme') { state.prefs.theme=state.prefs.theme==='dark'?'light':'dark'; savePrefs(); if(state.currentView==='settings') renderSettings(); }
      else if (action === 'jump-open') openJumpModal();
      else if (action === 'jump-close') closeJumpModal();
      else if (action === 'toggle-translation') { state.prefs.showTranslation=!state.prefs.showTranslation; savePrefs(); updateTranslationVisibility(); if(state.currentView==='settings') renderSettings(); }
      else if (action === 'open-surah') openSurah(Number(button.dataset.surah),1);
      else if (action === 'go-ayah') openSurah(Number(button.dataset.surah),Number(button.dataset.ayah));
      else if (action === 'bookmark') toggleBookmark(Number(button.dataset.surah),Number(button.dataset.ayah));
      else if (action === 'copy-ayah') await copyAyah(Number(button.dataset.surah),Number(button.dataset.ayah));
      else if (action === 'share-ayah') await shareAyah(Number(button.dataset.surah),Number(button.dataset.ayah));
      else if (action === 'play-ayah') playGlobalAyah(Number(button.dataset.global));
      else if (action === 'audio-current') startAudioAtCurrent();
      else if (action === 'audio-prev') navigateGlobal(-1,true);
      else if (action === 'audio-next') navigateGlobal(1,true);
      else if (action === 'audio-toggle') { if (audio.paused) { if (!audio.src) startAudioAtCurrent(); else audio.play().then(()=>{state.isPlaying=true;updatePlayingUI();}).catch(()=>toast('Audio could not start')); } else audio.pause(); }
      else if (action === 'audio-repeat') { state.repeatAyah=!state.repeatAyah; updatePlayingUI(); toast(state.repeatAyah?'Repeat ayah enabled':'Repeat ayah disabled'); }
      else if (action === 'surah-list') navTo('surahs');
      else if (action === 'previous-surah') { if(state.currentSurahNumber>1) openSurah(state.currentSurahNumber-1,1); }
      else if (action === 'next-surah') { if(state.currentSurahNumber<114) openSurah(state.currentSurahNumber+1,1); }
      else if (action === 'retry-data') retryData();
      else if (action === 'install-app') installApp();
      else if (action === 'clear-history') clearHistory();
      else if (action === 'back-to-read') navTo('reader');
      else if (action === 'clear-search') { $('#globalSearch').value=''; navTo('reader'); }
      else if (action === 'reset-prefs') { state.prefs={...defaultPrefs}; savePrefs(); renderSettings(); toast('Preferences reset'); }
      else if (action === 'clear-all-local') { if(window.confirm('Clear all bookmarks and reading history from this device?')) { state.bookmarks=[];state.history=[];saveBookmarks();setLocal('quranAdvanceHistory','[]');renderSettings();toast('Bookmarks and history cleared'); } }
      return;
    }
    const nav = event.target.closest('[data-view]');
    if (nav) navTo(nav.dataset.view);
  });
  $('#globalSearchForm').addEventListener('submit',event=>{event.preventDefault();const q=$('#globalSearch').value.trim();if(q){state.currentView='search';$$('.nav-item').forEach(btn=>btn.classList.remove('active'));renderSearchResults(q);window.scrollTo({top:0,behavior:'smooth'});}else toast('Enter a word, ayah, or surah to search.');});
  $('#jumpForm').addEventListener('submit',event=>{event.preventDefault();openSurah(Number($('#jumpSurah').value),Number($('#jumpAyah').value));});
  $('#jumpSurah').addEventListener('change',updateJumpAyahLimit);
  $('#audioSpeed').addEventListener('change',event=>{state.prefs.playbackSpeed=Number(event.target.value);savePrefs();});
  $('#settingsAudioSpeed').addEventListener('change',event=>{state.prefs.playbackSpeed=Number(event.target.value);savePrefs();audio.playbackRate=state.prefs.playbackSpeed;});
  viewRoot.addEventListener('input',event=>{
    const target=event.target;
    if (target.matches('[data-surah-filter]')) {
      const search = target.value, rev = $('[data-revelation-filter]')?.value || 'all';
      const selection = target.selectionStart;
      renderSurahs(search,rev);
      const newInput=$('[data-surah-filter]'); if(newInput){newInput.focus();newInput.setSelectionRange(selection,selection);}
    } else if (target.matches('[data-setting]')) {
      const setting=target.dataset.setting;
      if (setting==='arabicSize'||setting==='translationSize') {
        state.prefs[setting]=Number(target.value);savePrefs();
        const label=$(`#${setting==='arabicSize'?'arabicSizeLabel':'translationSizeLabel'}`);if(label)label.textContent=`${target.value}px`;
        if(state.currentView==='reader') { target.style.accentColor='var(--green)'; }
      } else if (setting==='showTranslation') { state.prefs.showTranslation=target.checked;savePrefs();updateTranslationVisibility(); }
      else if (setting==='playbackSpeed') { state.prefs.playbackSpeed=Number(target.value);savePrefs();audio.playbackRate=state.prefs.playbackSpeed; }
    }
  });
  viewRoot.addEventListener('change',event=>{
    const target=event.target;
    if (target.matches('[data-revelation-filter]')) renderSurahs($('[data-surah-filter]')?.value||'',target.value);
    if (target.matches('[data-setting="showTranslation"]')) { state.prefs.showTranslation=target.checked;savePrefs();updateTranslationVisibility(); }
  });
  audio.addEventListener('play',()=>{state.isPlaying=true;audioPlayer.hidden=false;updatePlayingUI();});
  audio.addEventListener('pause',()=>{state.isPlaying=false;updatePlayingUI();});
  audio.addEventListener('ended',()=>{if(state.repeatAyah){audio.currentTime=0;audio.play().catch(()=>{});}else navigateGlobal(1,true);});
  audio.addEventListener('error',()=>{state.isPlaying=false;updatePlayingUI();if(!audioPlayer.hidden)toast('Recitation unavailable. Check your connection and try again.');});
  window.addEventListener('online',()=>{updateConnection();if(state.isSample) setDataStatus('Demo data only');else setDataStatus('Online · Quran cached');});
  window.addEventListener('offline',()=>{updateConnection();setDataStatus(state.isSample?'Demo data only':'Quran loaded offline');});
  window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();state.installPrompt=event;const button=$('#installButton');if(button)button.textContent='＋ Install app';});
  window.addEventListener('appinstalled',()=>{state.installPrompt=null;toast('Quran Advance installed');});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&!$('#jumpModal').hidden){closeJumpModal();return;}
    const target=event.target;
    const typing=target.matches('input,textarea,select,[contenteditable="true"]');
    if(event.key==='/'&&!typing){event.preventDefault();$('#globalSearch').focus();}
    else if(event.key.toLowerCase()==='t'&&!typing){state.prefs.theme=state.prefs.theme==='dark'?'light':'dark';savePrefs();if(state.currentView==='settings')renderSettings();}
    else if(event.key.toLowerCase()==='b'&&!typing){const ayah=state.ayahByGlobal.get(state.currentGlobalNumber);if(ayah)toggleBookmark(ayah.surahNumber,ayah.numberInSurah);}
  });
  updateConnection();
  if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) {
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>{}).catch(error=>console.warn('Service worker registration failed',error)));
  }
  initialize();
})();
</script>
</body>
</html>
