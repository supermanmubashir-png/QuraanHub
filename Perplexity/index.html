<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quran Advance</title>
<meta name="description" content="A beautiful, offline-capable Quran reader with translations, bookmarks, audio, and AyahAI.">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230f766e'/%3E%3Cpath d='M96 38c-30 0-54 24-54 54s24 54 54 54 54-24 54-54S126 38 96 38zm0 20c19 0 34 15 34 34s-15 34-34 34-34-15-34-34 15-34 34-34z' fill='%23f8fafc'/%3E%3Cpath d='M96 70l9 18 20 3-14 14 3 20-18-10-18 10 3-20-14-14 20-3z' fill='%23fbbf24'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f4; --surface:#ffffff; --surface-2:#eef2ef; --text:#17211d; --muted:#5c6b64;
  --primary:#0f766e; --primary-contrast:#ffffff; --accent:#b45309; --border:#d9e2dc;
  --shadow:0 8px 24px rgba(15,23,42,.08); --radius:16px;
  --arabic-size:30px; --translation-size:16px;
}
[data-theme="dark"]{
  --bg:#0b1210; --surface:#121b18; --surface-2:#182420; --text:#e8f1ec; --muted:#9fb0a8;
  --primary:#2dd4bf; --primary-contrast:#04211d; --accent:#fbbf24; --border:#26332e;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.55; padding-bottom:76px;
}
button,a,select,input{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
a{color:var(--primary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.appbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 14px;
  padding-top:max(10px,env(safe-area-inset-top));
}
.appbar-row{display:flex;align-items:center;gap:10px;max-width:900px;margin:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.05rem}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-contrast);display:grid;place-items:center;font-weight:900}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border);transition:.2s;
}
.icon-btn:hover,.icon-btn:focus-visible{transform:translateY(-1px)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.ayahai-main{
  margin-left:auto;background:var(--primary);color:var(--primary-contrast);border-radius:999px;
  padding:9px 13px;font-weight:700;font-size:.82rem;text-decoration:none;display:inline-flex;gap:6px;align-items:center;
  box-shadow:var(--shadow);
}
.search-wrap{max-width:900px;margin:10px auto 0;position:relative}
.search-wrap input{
  width:100%;padding:12px 42px 12px 14px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);outline:none;
}
.search-wrap svg{position:absolute;right:13px;top:13px;width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:2}
main{max-width:900px;margin:auto;padding:14px}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-title{font-size:1.35rem;margin:8px 0 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:8px 13px;font-size:.82rem;font-weight:600;
}
.chip.active{background:var(--primary);color:var(--primary-contrast);border-color:transparent}
.surah-list{display:grid;gap:9px}
.surah-item{
  display:flex;gap:12px;align-items:center;padding:13px;width:100%;text-align:left;
  border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);
}
.surah-item:hover{border-color:var(--primary)}
.surah-num{
  min-width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;
  font-weight:800;font-size:.85rem;
}
.surah-meta{flex:1;min-width:0}
.surah-name{font-weight:750}
.surah-sub{color:var(--muted);font-size:.8rem}
.surah-arabic{font-family:"Amiri Quran","Scheherazade New","Noto Naskh Arabic",serif;font-size:1.25rem}
.reader-head{padding:18px;text-align:center}
.reader-head h1{margin:.2rem 0;font-size:1.5rem}
.reader-head .arabic-name{font-family:"Amiri Quran","Scheherazade New","Noto Naskh Arabic",serif;font-size:2rem}
.reader-tags{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
.tag{border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:var(--surface-2)}
.bismillah{
  font-family:"Amiri Quran","Scheherazade New","Noto Naskh Arabic",serif;
  font-size:calc(var(--arabic-size) * .9);text-align:center;margin:14px 0;
}
.ayah{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px;margin-bottom:12px;scroll-margin-top:130px;transition:.2s;
}
.ayah.playing{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
.ayah-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ayah-badge{
  min-width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;
  font-size:.75rem;font-weight:800;
}
.ayah-actions{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.action{
  border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:6px 8px;
  font-size:.72rem;font-weight:650;display:inline-flex;gap:5px;align-items:center;color:var(--muted);
}
.action:hover,.action:focus-visible{color:var(--primary);border-color:var(--primary)}
.action svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.arabic{
  direction:rtl;text-align:right;font-family:"Amiri Quran","Scheherazade New","Noto Naskh Arabic",serif;
  font-size:var(--arabic-size);line-height:2.15;margin:0 0 10px;
}
.translation{font-size:var(--translation-size);color:var(--text)}
.translation.hidden{display:none}
.ayah-ref{color:var(--muted);font-size:.72rem;margin-top:8px}
.audio-bar{
  position:fixed;left:0;right:0;bottom:66px;z-index:35;padding:9px 12px;
  background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:none;
}
.audio-bar.show{display:block}
.audio-inner{max-width:900px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.audio-title{flex:1;min-width:130px;font-size:.8rem;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audio-controls{display:flex;gap:5px;align-items:center}
.audio-controls select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:7px}
nav.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:grid;place-items:center;gap:2px;padding:7px 2px;border-radius:12px;color:var(--muted);
  font-size:.68rem;font-weight:700;
}
.tab.active{color:var(--primary);background:var(--surface-2)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.55)}
.modal.open{display:grid}
.modal-card{width:min(500px,100%);max-height:85vh;overflow:auto;padding:18px}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-head h2{margin:0;font-size:1.1rem;flex:1}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.setting label{font-weight:650;font-size:.9rem}
.setting small{display:block;color:var(--muted);font-weight:400}
input[type=range]{width:150px;accent-color:var(--primary)}
.switch{width:50px;height:29px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);position:relative}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:.2s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{left:24px;background:var(--primary-contrast)}
.empty{text-align:center;color:var(--muted);padding:30px 12px}
.skeleton{height:130px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:shine 1.3s infinite;margin-bottom:12px}
@keyframes shine{to{background-position:-200% 0}}
.status{max-width:900px;margin:0 auto 10px;padding:8px 14px;font-size:.78rem;color:var(--muted);text-align:center}
.status.offline{color:var(--accent)}
@media(min-width:720px){
  .surah-list{grid-template-columns:1fr 1fr}
  .appbar-row,.search-wrap,.status{max-width:1000px}
  main{max-width:1000px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-theme="light">

<header class="appbar">
  <div class="appbar-row">
    <div class="brand"><span class="brand-mark" aria-hidden="true">ق</span> Quran Advance</div>
    <a class="ayahai-main" href="https://supermanmubashir-png.github.io/AyahAI" target="_blank" rel="noopener noreferrer">Ask AyahAI</a>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark or light theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Open settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="search-wrap">
    <label class="sr-only" for="globalSearch">Search surahs and translations</label>
    <input id="globalSearch" type="search" placeholder="Search surah name, number, or translation…" autocomplete="off">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </div>
</header>

<div class="status" id="statusBar" role="status"></div>

<main>
  <section class="view active" id="homeView" aria-labelledby="homeTitle">
    <h1 class="page-title" id="homeTitle">The Noble Quran</h1>
    <div class="filters" role="group" aria-label="Filter surahs">
      <button class="chip active" data-filter="all">All 114</button>
      <button class="chip" data-filter="Meccan">Meccan</button>
      <button class="chip" data-filter="Medinan">Medinan</button>
      <button class="chip" id="continueBtn">Continue reading</button>
    </div>
    <div class="surah-list" id="surahList" aria-live="polite"></div>
  </section>

  <section class="view" id="readerView" aria-labelledby="readerTitle">
    <div id="readerContent"></div>
  </section>

  <section class="view" id="bookmarksView" aria-labelledby="bookmarksTitle">
    <h1 class="page-title" id="bookmarksTitle">Bookmarks</h1>
    <div id="bookmarksList" class="surah-list"></div>
  </section>

  <section class="view" id="historyView" aria-labelledby="historyTitle">
    <h1 class="page-title" id="historyTitle">Recently Read</h1>
    <div id="historyList" class="surah-list"></div>
  </section>
</main>

<div class="audio-bar" id="audioBar">
  <div class="audio-inner">
    <button class="icon-btn" id="prevAyahBtn" aria-label="Previous ayah">
      <svg viewBox="0 0 24 24"><path d="M18 5v14L8 12z"/><path d="M6 5v14"/></svg>
    </button>
    <button class="icon-btn" id="playPauseBtn" aria-label="Play or pause recitation">
      <svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
    </button>
    <button class="icon-btn" id="nextAyahBtn" aria-label="Next ayah">
      <svg viewBox="0 0 24 24"><path d="M6 5v14l10-7z"/><path d="M18 5v14"/></svg>
    </button>
    <div class="audio-title" id="audioTitle">Select an ayah to listen</div>
    <div class="audio-controls">
      <button class="action" id="repeatBtn" aria-pressed="false">Repeat: Off</button>
      <label class="sr-only" for="speedSelect">Playback speed</label>
      <select id="speedSelect" aria-label="Playback speed">
        <option value="0.75">0.75×</option><option value="1" selected>1×</option>
        <option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
      </select>
    </div>
  </div>
  <audio id="audioPlayer" preload="none"></audio>
</div>

<nav class="tabbar" aria-label="Main navigation">
  <button class="tab active" data-view="homeView" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg>Quran
  </button>
  <button class="tab" data-view="bookmarksView">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-5-6 5z"/></svg>Bookmarks
  </button>
  <button class="tab" data-view="historyView">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>History
  </button>
  <button class="tab" id="installTab">
    <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Install
  </button>
</nav>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="card modal-card">
    <div class="modal-head">
      <h2 id="settingsTitle">Settings</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Close settings">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="setting">
      <label for="arabicRange">Arabic text size<small>Currently <span id="arabicSizeLabel">30px</span></small></label>
      <input type="range" id="arabicRange" min="22" max="52" step="1" value="30">
    </div>
    <div class="setting">
      <label for="translationRange">Translation size<small>Currently <span id="translationSizeLabel">16px</span></small></label>
      <input type="range" id="translationRange" min="12" max="26" step="1" value="16">
    </div>
    <div class="setting">
      <label for="translationToggle">Show English translation<small>Hide it for Arabic-only reading</small></label>
      <button class="switch" id="translationToggle" role="switch" aria-checked="true" aria-label="Show English translation"></button>
    </div>
    <div class="setting">
      <label for="themeToggleSetting">Dark mode<small>Stored on this device</small></label>
      <button class="switch" id="themeToggleSetting" role="switch" aria-checked="false" aria-label="Enable dark mode"></button>
    </div>
    <p class="empty" style="padding:14px 0 0">No account, ads, analytics, or unnecessary permissions.</p>
  </div>
</div>

<script>
"use strict";
const API="https://api.alquran.cloud/v1";
const AUDIO_BASE="https://everyayah.com/data/Alafasy_128kbps";
const AYAHAI="https://supermanmubashir-png.github.io/AyahAI";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={
  get(k,d){try{const v=localStorage.getItem("qa_"+k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem("qa_"+k,JSON.stringify(v))}catch{}}
};
let surahs=[], currentSurah=null, currentAyahs=[], currentAyahIndex=-1, filter="all", deferredPrompt=null;

const settings={
  theme:store.get("theme",matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),
  arabic:store.get("arabicSize",30),
  translation:store.get("translationSize",16),
  showTranslation:store.get("showTranslation",true)
};

function applySettings(){
  document.documentElement.dataset.theme=settings.theme;
  document.body.style.setProperty("--arabic-size",settings.arabic+"px");
  document.body.style.setProperty("--translation-size",settings.translation+"px");
  $("#arabicRange").value=settings.arabic; $("#arabicSizeLabel").textContent=settings.arabic+"px";
  $("#translationRange").value=settings.translation; $("#translationSizeLabel").textContent=settings.translation+"px";
  $("#translationToggle").setAttribute("aria-checked",settings.showTranslation);
  $("#themeToggleSetting").setAttribute("aria-checked",settings.theme==="dark");
  store.set("theme",settings.theme); store.set("arabicSize",settings.arabic);
  store.set("translationSize",settings.translation); store.set("showTranslation",settings.showTranslation);
}

function setStatus(text,offline=false){
  const el=$("#statusBar"); el.textContent=text||""; el.classList.toggle("offline",offline);
}

function skeletons(n=6){$("#surahList").innerHTML=Array.from({length:n},()=>'<div class="skeleton"></div>').join("")}

async function fetchJSON(url){
  const res=await fetch(url);
  if(!res.ok) throw new Error(`Request failed (${res.status})`);
  return res.json();
}

async function loadSurahs(){
  skeletons();
  try{
    const data=await fetchJSON(`${API}/surah`);
    surahs=data.data;
    store.set("surahs",surahs);
    renderSurahs();
    setStatus(`Loaded ${surahs.length} surahs.`);
  }catch(e){
    surahs=store.get("surahs",[]);
    if(surahs.length){renderSurahs();setStatus("Offline: using previously saved surah list.",!navigator.onLine)}
    else{
      $("#surahList").innerHTML=`<div class="card empty"><strong>Could not load Quran data.</strong><br>${e.message}. Check your connection and reload.</div>`;
      setStatus("Quran data unavailable.",true);
    }
  }
}

function renderSurahs(){
  const q=$("#globalSearch").value.trim().toLowerCase();
  const list=surahs.filter(s=>{
    const matches=!q||String(s.number)===q||s.englishName.toLowerCase().includes(q)||
      s.name.includes($("#globalSearch").value.trim())||(s.englishNameTranslation||"").toLowerCase().includes(q);
    const revelation=filter==="all"||s.revelationType===filter;
    return matches&&revelation;
  });
  $("#surahList").innerHTML=list.length?list.map(s=>`
    <button class="surah-item" data-surah="${s.number}">
      <span class="surah-num">${s.number}</span>
      <span class="surah-meta">
        <span class="surah-name">${s.englishName} · ${s.englishNameTranslation||""}</span>
        <span class="surah-sub">${s.revelationType} · ${s.numberOfAyahs} ayahs</span>
      </span>
      <span class="surah-arabic" lang="ar" dir="rtl">${s.name}</span>
    </button>`).join(""):'<div class="card empty">No surahs match your search.</div>';
}

async function openSurah(number,ayah=1,autoplay=false){
  showView("readerView");
  $("#readerContent").innerHTML=Array.from({length:5},()=>'<div class="skeleton"></div>').join("");
  try{
    const data=await fetchJSON(`${API}/surah/${number}/editions/quran-uthmani,en.sahih`);
    const arabic=data.data[0], english=data.data[1];
    currentSurah=arabic; currentAyahs=arabic.ayahs.map((a,i)=>({
      number:a.numberInSurah,text:a.text,translation:english.ayahs[i]?.text||"",
      juz:a.juz,page:a.page,manzil:a.manzil,ruku:a.ruku,hizbQuarter:a.hizbQuarter,sajda:a.sajda
    }));
    renderReader();
    addToHistory(number);
    const target=$(`[data-ayah="${ayah}"]`);
    if(target){target.scrollIntoView({block:"start"});target.classList.add("playing");setTimeout(()=>target.classList.remove("playing"),2200)}
    store.set("lastRead",{surah:number,ayah});
    if(autoplay) playAyah(ayah-1);
  }catch(e){
    $("#readerContent").innerHTML=`<div class="card empty"><strong>Unable to load Surah ${number}.</strong><br>${e.message}. Previously viewed surahs may still be available from your browser cache.</div>`;
  }
}

function renderReader(){
  const s=currentSurah;
  const bookmarks=store.get("bookmarks",[]);
  const showBismillah=s.number!==1&&s.number!==9;
  $("#readerContent").innerHTML=`
    <article class="card reader-head">
      <div class="reader-tags"><span class="tag">Surah ${s.number}</span><span class="tag">${s.revelationType}</span><span class="tag">${s.numberOfAyahs} ayahs</span></div>
      <h1 id="readerTitle">${s.englishName}</h1>
      <div class="arabic-name" lang="ar" dir="rtl">${s.name}</div>
      <div class="reader-tags"><span class="tag">${s.englishNameTranslation||""}</span></div>
      ${showBismillah?'<div class="bismillah" lang="ar" dir="rtl">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>':""}
    </article>
    <div id="ayahContainer">
    ${currentAyahs.map((a,i)=>{
      const marked=bookmarks.some(b=>b.surah===s.number&&b.ayah===a.number);
      return `<article class="ayah" id="ayah-${a.number}" data-ayah="${a.number}" data-index="${i}">
        <div class="ayah-top">
          <span class="ayah-badge">${a.number}</span>
          <div class="ayah-actions">
            <button class="action bookmark-btn" data-surah="${s.number}" data-ayah="${a.number}" aria-pressed="${marked}" aria-label="Bookmark surah ${s.englishName} ayah ${a.number}">
              <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-5-6 5z"/></svg>${marked?"Saved":"Save"}
            </button>
            <button class="action play-btn" data-index="${i}" aria-label="Play surah ${s.englishName} ayah ${a.number}">
              <svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>Listen
            </button>
            <button class="action copy-btn" data-index="${i}" aria-label="Copy surah ${s.englishName} ayah ${a.number}">
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy
            </button>
            <button class="action share-btn" data-index="${i}" aria-label="Share surah ${s.englishName} ayah ${a.number}">
              <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>Share
            </button>
            <a class="action" target="_blank" rel="noopener noreferrer" aria-label="Ask AyahAI about surah ${s.englishName} ayah ${a.number}"
              href="${ayahaiUrl(s,a)}">Ask AyahAI</a>
          </div>
        </div>
        <p class="arabic" lang="ar" dir="rtl">${a.text}</p>
        ${settings.showTranslation?`<p class="translation">${a.translation}</p>`:'<p class="translation hidden"></p>'}
        <div class="ayah-ref">Juz ${a.juz} · Page ${a.page}${a.sajda&&a.sajda!=="none"?" · Sajda":""}</div>
      </article>`}).join("")}
    </div>`;
}

function ayahaiUrl(s,a){
  const params=new URLSearchParams({
    askAyahAI:"1",surah:s.englishName,surahNumber:String(s.number),
    ayahNumber:String(a.number),arabic:a.text,translation:a.translation
  });
  return `${AYAHAI}/home.html?${params.toString()}`;
}

function showView(id){
  $$(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  $$(".tab[data-view]").forEach(t=>{
    const active=t.dataset.view===id;
    t.classList.toggle("active",active);
    active?t.setAttribute("aria-current","page"):t.removeAttribute("aria-current");
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function addToHistory(number){
  const s=surahs.find(x=>x.number===number); if(!s)return;
  let history=store.get("history",[]).filter(h=>h.number!==number);
  history.unshift({number,englishName:s.englishName,name:s.name,revelationType:s.revelationType,numberOfAyahs:s.numberOfAyahs,at:Date.now()});
  store.set("history",history.slice(0,20)); renderHistory();
}

function renderHistory(){
  const history=store.get("history",[]);
  $("#historyList").innerHTML=history.length?history.map(h=>`
    <button class="surah-item" data-surah="${h.number}">
      <span class="surah-num">${h.number}</span>
      <span class="surah-meta"><span class="surah-name">${h.englishName}</span>
      <span class="surah-sub">${h.revelationType} · ${new Date(h.at).toLocaleString()}</span></span>
      <span class="surah-arabic" lang="ar" dir="rtl">${h.name}</span>
    </button>`).join(""):'<div class="card empty">No reading history yet.</div>';
}

function renderBookmarks(){
  const bookmarks=store.get("bookmarks",[]);
  $("#bookmarksList").innerHTML=bookmarks.length?bookmarks.map(b=>`
    <div class="card surah-item">
      <span class="surah-num">${b.surah}:${b.ayah}</span>
      <span class="surah-meta"><span class="surah-name">${b.surahName}</span>
      <span class="surah-sub">${new Date(b.timestamp).toLocaleString()}</span></span>
      <button class="action open-bookmark" data-surah="${b.surah}" data-ayah="${b.ayah}">Open</button>
      <button class="action remove-bookmark" data-surah="${b.surah}" data-ayah="${b.ayah}" aria-label="Remove bookmark">Remove</button>
    </div>`).join(""):'<div class="card empty">No bookmarks yet. Use the Save button beside any ayah.</div>';
}

function toggleBookmark(surah,ayah){
  let bookmarks=store.get("bookmarks",[]);
  const existing=bookmarks.find(b=>b.surah===surah&&b.ayah===ayah);
  if(existing) bookmarks=bookmarks.filter(b=>b!==existing);
  else bookmarks.unshift({surah,ayah,surahName:currentSurah?.englishName||`Surah ${surah}`,timestamp:Date.now()});
  store.set("bookmarks",bookmarks);
  $$(`.bookmark-btn[data-surah="${surah}"][data-ayah="${ayah}"]`).forEach(btn=>{
    const on=!!bookmarks.find(b=>b.surah===surah&&b.ayah===ayah);
    btn.setAttribute("aria-pressed",on); btn.lastChild.textContent=on?"Saved":"Save";
  });
  renderBookmarks();
}

function audioUrl(surah,ayah){
  return `${AUDIO_BASE}/${String(surah).padStart(3,"0")}${String(ayah).padStart(3,"0")}.mp3`;
}

function playAyah(index){
  if(!currentAyahs[index])return;
  currentAyahIndex=index;
  const a=currentAyahs[index], player=$("#audioPlayer");
  player.src=audioUrl(currentSurah.number,a.number);
  player.playbackRate=parseFloat($("#speedSelect").value);
  player.play().catch(()=>setStatus("Tap Listen again to allow audio playback."));
  $("#audioTitle").textContent=`${currentSurah.englishName} · Ayah ${a.number}`;
  $("#audioBar").classList.add("show");
  $$(".ayah").forEach(el=>el.classList.toggle("playing",+el.dataset.index===index));
  const el=$(`[data-ayah="${a.number}"]`); el?.scrollIntoView({block:"center",behavior:"smooth"});
  store.set("lastRead",{surah:currentSurah.number,ayah:a.number});
}

$("#audioPlayer").addEventListener("ended",()=>{
  if($("#repeatBtn").getAttribute("aria-pressed")==="true"){playAyah(currentAyahIndex);return}
  if(currentAyahIndex<currentAyahs.length-1) playAyah(currentAyahIndex+1);
});
$("#playPauseBtn").addEventListener("click",()=>{
  const p=$("#audioPlayer");
  if(!p.src)return;
  p.paused?p.play():p.pause();
});
$("#prevAyahBtn").addEventListener("click",()=>playAyah(Math.max(0,currentAyahIndex-1)));
$("#nextAyahBtn").addEventListener("click",()=>playAyah(Math.min(currentAyahs.length-1,currentAyahIndex+1)));
$("#repeatBtn").addEventListener("click",e=>{
  const on=e.currentTarget.getAttribute("aria-pressed")!=="true";
  e.currentTarget.setAttribute("aria-pressed",on);
  e.currentTarget.textContent=`Repeat: ${on?"On":"Off"}`;
});
$("#speedSelect").addEventListener("change",e=>{$("#audioPlayer").playbackRate=parseFloat(e.target.value)});

document.addEventListener("click",async e=>{
  const surahBtn=e.target.closest("[data-surah]");
  if(surahBtn&&!e.target.closest(".action")){openSurah(+surahBtn.dataset.surah);return}
  const bookmark=e.target.closest(".bookmark-btn");
  if(bookmark){toggleBookmark(+bookmark.dataset.surah,+bookmark.dataset.ayah);return}
  const play=e.target.closest(".play-btn");
  if(play){playAyah(+play.dataset.index);return}
  const copy=e.target.closest(".copy-btn");
  if(copy){
    const a=currentAyahs[+copy.dataset.index];
    try{await navigator.clipboard.writeText(`${a.text}\n\n${a.translation}\n— Quran ${currentSurah.englishName} ${a.number}`);setStatus("Ayah copied.")}
    catch{setStatus("Copying is not available in this browser.",true)}
    return;
  }
  const share=e.target.closest(".share-btn");
  if(share){
    const a=currentAyahs[+share.dataset.index];
    const text=`${a.text}\n\n${a.translation}\n— Quran ${currentSurah.englishName} ${a.number}`;
    if(navigator.share){try{await navigator.share({title:`Quran ${currentSurah.englishName} ${a.number}`,text})}catch{}}
    else{try{await navigator.clipboard.writeText(text);setStatus("Sharing unavailable; ayah copied instead.")}catch{setStatus("Sharing is unavailable.",true)}}
    return;
  }
  const openB=e.target.closest(".open-bookmark");
  if(openB){openSurah(+openB.dataset.surah,+openB.dataset.ayah);return}
  const removeB=e.target.closest(".remove-bookmark");
  if(removeB){
    const surah=+removeB.dataset.surah, ayah=+removeB.dataset.ayah;
    store.set("bookmarks",store.get("bookmarks",[]).filter(b=>!(b.surah===surah&&b.ayah===ayah)));
    renderBookmarks();return;
  }
  const chip=e.target.closest(".chip[data-filter]");
  if(chip){filter=chip.dataset.filter;$$(".chip[data-filter]").forEach(c=>c.classList.toggle("active",c===chip));renderSurahs();return}
  const tab=e.target.closest(".tab[data-view]");
  if(tab){
    showView(tab.dataset.view);
    if(tab.dataset.view==="bookmarksView")renderBookmarks();
    if(tab.dataset.view==="historyView")renderHistory();
  }
});

$("#globalSearch").addEventListener("input",()=>{showView("homeView");renderSurahs()});
$("#continueBtn").addEventListener("click",()=>{
  const last=store.get("lastRead",null);
  last?openSurah(last.surah,last.ayah):setStatus("No saved reading position yet.");
});
$("#themeToggle").addEventListener("click",()=>{settings.theme=settings.theme==="dark"?"light":"dark";applySettings()});
$("#themeToggleSetting").addEventListener("click",()=>{settings.theme=settings.theme==="dark"?"light":"dark";applySettings()});
$("#arabicRange").addEventListener("input",e=>{settings.arabic=+e.target.value;applySettings()});
$("#translationRange").addEventListener("input",e=>{settings.translation=+e.target.value;applySettings()});
$("#translationToggle").addEventListener("click",e=>{
  settings.showTranslation=!settings.showTranslation;applySettings();
  $$(".translation").forEach(p=>p.classList.toggle("hidden",!settings.showTranslation));
});
$("#settingsBtn").addEventListener("click",()=>$("#settingsModal").classList.add("open"));
$("#closeSettings").addEventListener("click",()=>$("#settingsModal").classList.remove("open"));
$("#settingsModal").addEventListener("click",e=>{if(e.target.id==="settingsModal")e.currentTarget.classList.remove("open")});
$("#installTab").addEventListener("click",async()=>{
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==="accepted")setStatus("App installed.")}
  else setStatus("Use your browser menu → Install app / Add to Home Screen.");
});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});
window.addEventListener("online",()=>setStatus("Back online."));
window.addEventListener("offline",()=>setStatus("Offline mode: cached Quran content remains available.",true));

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea"))return;
  if(e.key==="/"){e.preventDefault();$("#globalSearch").focus()}
  if(e.key.toLowerCase()==="t"){settings.theme=settings.theme==="dark"?"light":"dark";applySettings()}
  if(e.key.toLowerCase()==="b"&&currentSurah&&currentAyahs[currentAyahIndex])toggleBookmark(currentSurah.number,currentAyahs[currentAyahIndex].number);
  if(e.key==="Escape")$("#settingsModal").classList.remove("open");
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
applySettings(); loadSurahs(); renderBookmarks(); renderHistory();
</script>
</body>
</html>
